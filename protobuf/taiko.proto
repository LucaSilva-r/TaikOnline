message PlayResultRequest {
 optional uint32 baid_conf = 1;
 optional string chassis_id_conf = 2;
 optional string shop_id_conf = 3;
 optional string play_datetime_conf = 4;
 optional bytes playresult_data = 5;
}

message PlayResultResponse {
 optional uint32 result = 1;
}

message PlayResultDataRequest {
 message StageData {
  message ResultcompeData {
   optional uint32 compe_id = 1;
   optional uint32 track_no = 2;
  }

  message GhostStageData {
   message GhostStageSectionData {
    optional bool is_win = 1;
    optional uint32 good_cnt = 2;
    optional uint32 ok_cnt = 3;
    optional uint32 ng_cnt = 4;
    optional uint32 pound_cnt = 5;
   }

   optional bool is_win = 1;
   optional uint32 sd_certified_level_id = 2;
   repeated PlayResultDataRequest.StageData.GhostStageData.GhostStageSectionData ary_section_data = 3;
  }

  optional uint32 song_no = 1;
  optional uint32 level = 2;
  optional uint32 play_result = 3;
  optional uint32 play_score = 4;
  repeated PlayResultDataRequest.StageData.ResultcompeData ary_challenge_id = 5;
  repeated PlayResultDataRequest.StageData.ResultcompeData ary_user_compe_id = 6;
  repeated PlayResultDataRequest.StageData.ResultcompeData ary_bng_compe_id = 7;
  optional uint32 good_cnt = 8;
  optional uint32 ok_cnt = 9;
  optional uint32 ng_cnt = 10;
  optional uint32 pound_cnt = 11;
  optional uint32 combo_cnt = 12;
  optional bytes option_flg = 13;
  optional bytes tone_flg = 14;
  optional uint32 music_categ = 15;
  optional bool is_pushed = 16;
  optional bool is_favorite = 17;
  optional bool is_recent = 18;
  optional bool is_papamama = 19;
  optional uint32 play_dan = 20;
  optional uint32 soul_gauge = 21;
  optional uint32 hit_cnt = 22;
  optional uint32 stage_mode = 23;
  optional uint32 selected_folder_id = 24;
  optional uint32 waiwai_result = 25;
  optional uint32 waiwai_gauge = 26;
  optional uint32 star_level = 27;
  optional uint32 support_level = 28;
  optional PlayResultDataRequest.StageData.GhostStageData ghost_stagedata = 29;
 }

 message CostumeData {
  optional uint32 costume_1 = 1;
  optional uint32 costume_2 = 2;
  optional uint32 costume_3 = 3;
  optional uint32 costume_4 = 4;
  optional uint32 costume_5 = 5;
 }

 message CollaboData {
  optional uint32 collabo_select = 1;
  optional uint32 collabo_id = 2;
  optional uint32 collabo_result = 3;
 }

 message UpdateGhostInfoData {
  message GhostTokenData {
   optional uint32 token_id = 1;
   optional uint32 token_value = 2;
  }

  repeated uint32 release_info_id = 1;
  repeated PlayResultDataRequest.UpdateGhostInfoData.GhostTokenData ary_tokendata = 2;
 }

 message UpdateGhostPerfData {
  optional sint32 input_median = 1;
  optional uint32 input_variance = 2;
 }

 message UpdateGhostRankData {
  message UpdateGhostWinningsData {
   optional uint32 level_id = 1;
   optional uint32 winnings = 2;
  }

  optional uint32 rank_id = 1;
  optional uint32 win_point = 2;
  optional uint32 certified_level_id = 3;
  repeated PlayResultDataRequest.UpdateGhostRankData.UpdateGhostWinningsData ary_winnings_data = 4;
 }

 optional uint32 baid = 1;
 optional string chassis_id = 2;
 optional string shop_id = 3;
 optional string play_datetime = 4;
 optional bool is_right = 5;
 optional uint32 card_type = 6;
 optional bool is_two_players = 7;
 repeated PlayResultDataRequest.StageData ary_stage_info = 8;
 repeated uint32 release_song_no = 9;
 repeated uint32 get_tone_no = 10;
 repeated uint32 get_costume_no_1 = 11;
 repeated uint32 get_costume_no_2 = 12;
 repeated uint32 get_costume_no_3 = 13;
 repeated uint32 get_costume_no_4 = 14;
 repeated uint32 get_costume_no_5 = 15;
 repeated uint32 get_title_no = 16;
 optional bool bonus_daily_flg = 17;
 optional bool bonus_weekly_flg = 18;
 optional bool bonus_monthly_flg = 19;
 optional uint32 get_donmedal = 20;
 optional uint32 get_katsumedal = 21;
 optional uint32 itemshop_tutorial_flg = 22;
 optional bool is_devil = 23;
 optional bool is_explain = 24;
 optional PlayResultDataRequest.CostumeData ary_play_costume = 25;
 optional PlayResultDataRequest.CostumeData ary_current_costume = 26;
 optional uint32 gender_type = 27;
 optional uint32 player_age = 28;
 optional uint32 play_mode = 29;
 optional uint32 area_code = 30;
 optional bytes reserved = 31;
 optional uint32 lowerlimit_age = 32;
 optional uint32 upperlimit_age = 33;
 optional uint32 age_score = 34;
 optional uint32 estimation_count = 35;
 optional uint32 dan_result = 36;
 repeated PlayResultDataRequest.CollaboData ary_collabo_info = 37;
 optional uint32 tournament_mode = 38;
 optional string accesstoken = 39;
 optional bytes content_info = 40;
 optional uint32 difficulty_played_course = 41;
 optional uint32 difficulty_played_star = 42;
 optional uint32 waiwai_tutorial_flg = 43;
 optional PlayResultDataRequest.UpdateGhostInfoData ghost_release_data = 44;
 optional PlayResultDataRequest.UpdateGhostPerfData ghost_update_perfdata = 45;
 optional PlayResultDataRequest.UpdateGhostRankData ghost_update_rank = 46;
}

