syntax = "proto2";

package taiko.green;

option php_namespace = "App\\GameProtocol\\Green\\Proto\\Taiko";
option php_metadata_namespace = "App\\GameProtocol\\Green\\Proto\\Metadata";

message BookKeepingRequest {
 optional string chassis_id = 1;
 optional string shop_id = 2;
 optional string update_date = 3;
 optional uint32 credit_cost_1 = 4;
 optional uint32 credit_cost_2 = 5;
 optional uint32 credit_songs_1 = 6;
 optional uint32 credit_songs_2 = 7;
 optional uint32 all_play_cnt = 8;
 optional uint32 service_sw_cnt = 9;
 optional uint32 free_play_cnt = 10;
}

message BookKeepingResponse {
 optional uint32 result = 1;
}

message GettelopRequest {
 optional string chassis_id = 1;
 optional string shop_id = 2;
 optional uint32 telop_id = 3;
}

message GettelopResponse {
 optional uint32 result = 1;
 optional uint32 verup_no = 2;
 optional string start_datetime = 3;
 optional string end_datetime = 4;
