  optional uint32 folder_id = 1;
  optional uint32 verup_no = 2;
  repeated uint32 song_no = 3;
 }

 optional uint32 result = 1;
 repeated GetfolderResponse.EventfolderData ary_eventfolder_data = 2;
}

message TaikojukuRequest {
 optional string chassis_id = 1;
 optional string shop_id = 2;
 repeated uint32 get_dan = 3;
}

message TaikojukuResponse {
 message JukupackData {
  message JukusongData {
   optional uint32 song_no = 1;
   optional uint32 level = 2;
  }

  optional uint32 get_dan = 1;
  optional uint32 verup_no = 2;
  repeated TaikojukuResponse.JukupackData.JukusongData ary_jukusong_data = 3;
 }

 optional uint32 result = 1;
 repeated TaikojukuResponse.JukupackData ary_jukupack_data = 2;
}

message InitialdatacheckRequest {
