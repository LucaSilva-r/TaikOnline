 optional bytes hash_mainichidojo_rare = 5;
 repeated InitialdatacheckResponse.InformationData ary_telop_data = 6;
 repeated InitialdatacheckResponse.InformationData ary_eventfolder_data = 7;
 repeated InitialdatacheckResponse.InformationData ary_taikojuku_data = 8;
 repeated InitialdatacheckResponse.InformationData ary_itemshop_data = 9;
 optional bool is_danplay = 10;
 optional bool is_close = 11;
 optional bool is_itemshop = 12;
 optional bool is_ghostbattleplay = 13;
}

message TournamentcheckRequest {
