}

message TournamentcheckResponse {
 message GachainfoData {
  optional bytes normal_gacha_flg = 1;
  optional bytes rare_gacha_flg = 2;
 }

 optional uint32 result = 1;
 optional uint32 rare_rate = 2;
 optional uint32 song_hash_ver = 3;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_song_data = 4;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_tone_data = 5;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_costume_1_data = 6;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_costume_2_data = 7;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_costume_3_data = 8;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_costume_4_data = 9;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_costume_5_data = 10;
 repeated TournamentcheckResponse.GachainfoData ary_gacha_title_data = 11;
}

message GetitemshopinfoRequest {
