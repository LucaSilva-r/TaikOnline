user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log /var/log/nginx/access.log;
    resolver 127.0.0.11 valid=10s ipv6=off;
    keepalive_timeout 0;
    server_tokens off;

    # All terminator ports forward into the same Laravel backend.
    # laravel-app is the compose alias for the laravel.test service.
    upstream laravel_backend {
        server laravel-app:8080;
    }

    # Modern TLS only. The SPRX's mbedTLS client offers
    # TLS 1.2 ECDHE-RSA + AES-GCM / CHACHA20-POLY1305; TLS 1.3 stays
    # available for when M6 turns it on. Old PS3-firmware TLS 1.0
    # clients are deliberately not supported here — that is the whole
    # reason we replaced the legacy proxy.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_http_version 1.1;
    proxy_set_header Connection close;
    proxy_hide_header Host;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;

    server {
        listen 10122 ssl;
        ssl_certificate     /certificates/generated/mucha/chain.pem;
        ssl_certificate_key /certificates/generated/mucha/leaf.key;
        ssl_verify_client   optional_no_ca;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://laravel_backend;
        }
    }

    # VS-API / startup HTTPS endpoints. The cabinet hits 443 and the
    # three high ports interchangeably depending on subsystem; they
    # all share the same leaf cert.
    server {
        listen 443 ssl;
        ssl_certificate     /certificates/generated/vsapi/chain.pem;
        ssl_certificate_key /certificates/generated/vsapi/leaf.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://laravel_backend;
        }
    }
    server {
        listen 54430 ssl;
        ssl_certificate     /certificates/generated/vsapi/chain.pem;
        ssl_certificate_key /certificates/generated/vsapi/leaf.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://laravel_backend;
        }
    }
    server {
        listen 54431 ssl;
        ssl_certificate     /certificates/generated/vsapi/chain.pem;
        ssl_certificate_key /certificates/generated/vsapi/leaf.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://laravel_backend;
        }
    }
    server {
        listen 57402 ssl;
        ssl_certificate     /certificates/generated/vsapi/chain.pem;
        ssl_certificate_key /certificates/generated/vsapi/leaf.key;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://laravel_backend;
        }
    }
}
