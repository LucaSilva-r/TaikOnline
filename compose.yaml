services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'taikonline/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '8080'
        ports:
            #- '${APP_PORT:-8080}:8080'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=8080'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            sail:
                aliases:
                    - laravel-app
        depends_on:
            - pgsql
        restart: unless-stopped

    queue:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'taikonline/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php /var/www/html/artisan queue:work database --queue=default --sleep=1 --tries=1 --timeout=3600'
            DB_QUEUE_RETRY_AFTER: 3900
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
        restart: unless-stopped

    reverb:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'taikonline/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080'
        volumes:
            - '.:/var/www/html'
        networks:
            sail:
                aliases:
                    - reverb
        restart: unless-stopped

    tls-proxy:
        build:
            context: './docker/tls-proxy'
            dockerfile: Dockerfile
        ports:
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - './certificates/local:/certificates/local:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped

    # Publishes this dev server as staging: docker compose --profile staging up -d cloudflare-tunnel. In the tunnel's public
    # hostname, the service is https://tls-proxy:443 with TLS verification off (it serves the local certificate).
    cloudflare-tunnel:
        image: cloudflare/cloudflared:latest
        profiles: ['staging']
        environment:
            TUNNEL_TOKEN: '${CLOUDFLARE_TUNNEL_TOKEN:-}'
        command: tunnel --no-autoupdate run
        networks:
            - sail
        depends_on:
            - tls-proxy
        restart: unless-stopped

    # Relays Waddamburo's online play between players who can't reach each other directly (relay/). Reached through the
    # Cloudflare tunnel's own hostname for it, so the server's address stays hidden.
    relay:
        build: ./relay
        environment:
            RELAY_SECRET: '${RELAY_SECRET:-local-dev-secret}'
        ports:
            - '${RELAY_PORT:-8090}:8080'
        networks:
            - sail
        restart: unless-stopped

    redis:
        image: 'valkey/valkey:8-alpine'
        command: ['valkey-server', '--save', '', '--appendonly', 'no']
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            retries: 3
            timeout: 5s
        restart: unless-stopped

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
        restart: unless-stopped

networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
