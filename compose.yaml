services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'taikonline/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '8080'
        ports:
            #- '${APP_PORT:-8080}:8080'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan serve --host=0.0.0.0 --port=8080'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            sail:
                aliases:
                    - laravel-app
        depends_on:
            - pgsql
        restart: unless-stopped

    queue:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'taikonline/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php /var/www/html/artisan queue:work database --queue=default --sleep=1 --tries=1 --timeout=3600'
            DB_QUEUE_RETRY_AFTER: 3900
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
        restart: unless-stopped

    reverb:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'taikonline/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080'
        volumes:
            - '.:/var/www/html'
        networks:
            sail:
                aliases:
                    - reverb
        restart: unless-stopped

    tls-proxy:
        build:
            context: './docker/tls-proxy'
            dockerfile: Dockerfile
        ports:
            - '${HTTPS_PORT:-443}:443'
        volumes:
            - './certificates/local:/certificates/local:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped

    # Publishes this dev server as staging: docker compose --profile staging up -d cloudflare-tunnel. In the tunnel's public
    # hostname, the service is https://tls-proxy:443 with TLS verification off (it serves the local certificate).
    cloudflare-tunnel:
        image: cloudflare/cloudflared:latest
        profiles: ['staging']
        environment:
            TUNNEL_TOKEN: '${CLOUDFLARE_TUNNEL_TOKEN:-}'
        command: tunnel --no-autoupdate run
        networks:
            - sail
        depends_on:
            - tls-proxy
        restart: unless-stopped

    # STUN and relay for Waddamburo's online play. UDP only, and nothing inside this network or the VPS is reachable through it.
    turn:
        image: 'coturn/coturn:4.7.0'
        command:
            - '--use-auth-secret'
            - '--static-auth-secret=${TURN_SECRET:-local-dev-secret}'
            - '--realm=${TURN_HOST:-localhost}'
            - '--min-port=49160'
            - '--max-port=49260'
            - '--no-tcp'
            - '--no-tls'
            - '--no-dtls'
            - '--no-tcp-relay'
            - '--no-cli'
            - '--no-multicast-peers'
            - '--denied-peer-ip=0.0.0.0-0.255.255.255'
            - '--denied-peer-ip=10.0.0.0-10.255.255.255'
            - '--denied-peer-ip=100.64.0.0-100.127.255.255'
            - '--denied-peer-ip=127.0.0.0-127.255.255.255'
            - '--denied-peer-ip=169.254.0.0-169.254.255.255'
            - '--denied-peer-ip=172.16.0.0-172.31.255.255'
            - '--denied-peer-ip=192.168.0.0-192.168.255.255'
            - '--denied-peer-ip=::1'
            - '--denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff'
            - '--denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff'
        ports:
            - '${TURN_PORT:-3478}:3478/udp'
            - '49160-49260:49160-49260/udp'
        networks:
            - sail
        restart: unless-stopped

    # Player status only, all of it stale within 90 s: nothing to persist.
    redis:
        image: 'valkey/valkey:8-alpine'
        command: ['valkey-server', '--save', '', '--appendonly', 'no']
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            retries: 3
            timeout: 5s
        restart: unless-stopped

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
        restart: unless-stopped

networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
