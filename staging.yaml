
services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '8080'
        ports:
            #- '${APP_PORT:-8080}:8080'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_COMMAND: "/bin/bash -c '/usr/bin/php /var/www/html/artisan route:clear && /usr/bin/php /var/www/html/artisan config:clear && /usr/bin/php /var/www/html/artisan view:clear && /usr/bin/php /var/www/html/artisan optimize && /usr/bin/php -d variables_order=EGPCS /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --admin-port=2019 --port=${APP_PORT:-80}'"
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            XDG_CONFIG_HOME:  /var/www/html/config
            XDG_DATA_HOME:  /var/www/html/data
        volumes:
            - '.:/var/www/html'
        labels:
            - 'traefik.enable=true'
            - 'traefik.docker.network=main'
            - 'traefik.http.routers.taikonline.entrypoints=websecure'
            - 'traefik.http.routers.taikonline.rule=Host(`taiko.silvaserv.it`)'
            - 'traefik.http.routers.taikonline.tls=true'
            - 'traefik.http.routers.taikonline.tls.certresolver=lets-encrypt'
            - 'traefik.http.routers.taikonline.service=taikonline'
            - 'traefik.http.services.taikonline.loadbalancer.server.port=80'
            # - 'traefik.http.routers.taikonline.middlewares=strip-cabinet-headers'

            # - 'traefik.http.middlewares.strip-cabinet-headers.headers.customresponseheaders.Host='
            # - 'traefik.http.middlewares.strip-cabinet-headers.headers.customresponseheaders.X-Powered-By='
            # - 'traefik.http.middlewares.strip-cabinet-headers.headers.customresponseheaders.Cache-Control='
            # - 'traefik.http.middlewares.strip-cabinet-headers.headers.customresponseheaders.Expires='
            # - 'traefik.http.middlewares.strip-cabinet-headers.headers.customresponseheaders.Pragma='

        networks:
            main:
                aliases:
                    - laravel-app
        depends_on:
            - pgsql
        restart: unless-stopped

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - main
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
        restart: unless-stopped

networks:
    main:
        external: true
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
